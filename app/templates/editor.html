{% extends "base.html" %}

{% block content %}
<div class="container-fluid mt-3 mb-5">
    
    <!-- Controls Panel -->
    <div class="row mb-4">
        <div class="col-12 glass-panel p-3 d-flex align-items-center gap-3 flex-wrap justify-content-between">
            <div class="editor-controls">
                <select id="style-selector" class="custom-select">
                    <option value="style-clean">Style: Clean White</option>
                    <option value="style-ig-glow">Style: IG Glow 💧</option>
                    <option value="style-ig-green">Style: Neon Green 🐍</option>
                    <option value="style-emoji">Style: Emoji 😜</option>
                </select>

                <select id="pos-selector" class="custom-select">
                    <option value="pos-top">Pos: Top</option>
                    <option value="pos-center">Pos: Center</option>
                    <option value="pos-bottom" selected>Pos: Bottom</option>
                </select>

                <select id="anim-selector" class="custom-select">
                    <option value="anim-none">Anim: None</option>
                    <option value="anim-pop">Anim: Pop In 💥</option>
                    <option value="anim-slide">Anim: Slide Up ⬆️</option>
                    <option value="anim-bounce">Anim: Bounce 🏀</option>
                    <option value="anim-karaoke">Anim: Karaoke 🎤</option>
                </select>
            </div>
            
            <button id="render-btn" class="btn-gradient px-4">
                <i class="fas fa-file-export me-2"></i> Export Video
            </button>
        </div>
    </div>

    <div class="row g-4">
        <!-- Video Preview Area -->
        <div class="col-lg-8">
            <div class="glass-panel p-2">
                <div class="p-3 d-flex justify-content-center align-items-center" style="min-height: 50vh;">
                    
                    <div class="video-wrapper">
                        <video id="main-video" controls>
                            <source src="{{ url_for('main.serve_media', filename='uploads/' + filename) }}" type="video/mp4">
                        </video>

                        <div id="lyric-overlay" class="pos-bottom">
                            <h2 id="current-lyric" class="style-clean px-3 text-center transition-all">...</h2>
                        </div>
                    </div>

                </div>
                
                <div id="progress-container" class="p-3 border-top border-secondary border-opacity-25 d-none">
                    <div class="d-flex justify-content-between mb-2">
                        <small class="text-white fw-semibold">Rendering Status:</small>
                        <small id="progress-status" class="text-info fw-bold">Starting engine...</small>
                    </div>
                    <div class="progress bg-dark" style="height: 8px;">
                        <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated bg-primary" style="width: 100%"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Lyrics Editor Area -->
        <div class="col-lg-4">
            <div class="glass-panel h-100 d-flex flex-column">
                <div class="p-3 border-bottom border-secondary border-opacity-25 d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 fw-bold"><i class="fas fa-align-left me-2 text-primary"></i> Lyrics Editor</h5>
                    <button id="save-btn" class="btn btn-sm btn-outline-light rounded-pill px-3">Save</button>
                </div>
                <div class="p-2" style="overflow-y: auto; height: 60vh;">
                    <div id="transcript-list" class="d-flex flex-column gap-1"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const video = document.getElementById("main-video");
    const overlay = document.getElementById("lyric-overlay");
    const lyricDisplay = document.getElementById("current-lyric");
    const transcriptList = document.getElementById("transcript-list");
    
    // Controls
    const styleSelector = document.getElementById("style-selector");
    const posSelector = document.getElementById("pos-selector");
    const animSelector = document.getElementById("anim-selector");
    
    let lyricData = [];
    const filename = "{{ filename }}";
    
    // 1. Load Data
    fetch("{{ url_for('main.get_data', filename=filename) }}")
        .then(res => res.json())
        .then(data => { lyricData = data.segments; renderList(); });

    // 2. Video Sync
    video.addEventListener("timeupdate", () => {
        const t = video.currentTime;
        const seg = lyricData.find(s => t >= s.start && t <= s.end);
        if (seg) {
            lyricDisplay.innerText = seg.word;
            lyricDisplay.style.opacity = 1;
        } else {
            lyricDisplay.innerText = "";
        }
    });

    // 3. UI Update Logic
    function updateClasses() {
        lyricDisplay.className = "px-3 text-center transition-all"; 
        lyricDisplay.classList.add(styleSelector.value);
        if (animSelector.value !== 'anim-none') {
            lyricDisplay.classList.add(animSelector.value);
        }
        overlay.className = ""; 
        overlay.classList.add(posSelector.value); 
    }
    styleSelector.addEventListener("change", updateClasses);
    posSelector.addEventListener("change", updateClasses);
    animSelector.addEventListener("change", updateClasses);
    updateClasses();

    // 4. RENDER BUTTON (Synchronous)
    document.getElementById("render-btn").addEventListener("click", () => {
        const btn = document.getElementById("render-btn");
        const statusText = document.getElementById("progress-status");
        
        btn.disabled = true;
        btn.innerHTML = `<i class="fas fa-spinner fa-spin me-2"></i> Processing...`;
        document.getElementById("progress-container").classList.remove("d-none");
        statusText.innerText = "Rendering... (Please wait, do not close tab)";
        
        fetch("/render", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                filename: filename,
                style: styleSelector.value,
                animation: animSelector.value,
                position: posSelector.value
            })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                statusText.innerText = "Done! Download starting...";
                window.location.href = data.download_url;
            } else {
                alert("Error: " + data.message);
            }
            btn.disabled = false;
            btn.innerHTML = `<i class="fas fa-file-export me-2"></i> Export Video`;
            setTimeout(() => { document.getElementById("progress-container").classList.add("d-none"); }, 3000);
        })
        .catch(err => {
            alert("Timeout or Error. Try a shorter video.");
            btn.disabled = false;
            btn.innerHTML = `<i class="fas fa-file-export me-2"></i> Export Video`;
            document.getElementById("progress-container").classList.add("d-none");
        });
    });

    function renderList() {
        transcriptList.innerHTML = "";
        lyricData.forEach((seg, i) => {
            const div = document.createElement("div");
            div.className = "transcript-item p-2 d-flex align-items-center gap-3";
            div.innerHTML = `<div class="timestamp-badge badge rounded-pill px-3 py-2 fs-6">${seg.start.toFixed(1)}s</div>
                             <input class="form-control transcript-input fs-5" value="${seg.word}">`;
            div.querySelector("input").oninput = (e) => lyricData[i].word = e.target.value;
            div.querySelector(".timestamp-badge").onclick = () => { video.currentTime = seg.start; video.play(); };
            transcriptList.appendChild(div);
        });
    }

    document.getElementById("save-btn").addEventListener("click", function() {
        const btn = document.getElementById("save-btn");
        btn.innerText = "Saving...";
        fetch("{{ url_for('main.update_data', filename=filename) }}", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ segments: lyricData })
        }).then(() => {
            btn.innerText = "Saved!";
            btn.classList.replace("btn-outline-light", "btn-success");
            setTimeout(() => {
                btn.innerText = "Save";
                btn.classList.replace("btn-success", "btn-outline-light");
            }, 2000);
        });
    });
});
</script>
{% endblock %}
